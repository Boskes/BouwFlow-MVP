services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bouwflow
      POSTGRES_USER: bouwflow
      POSTGRES_PASSWORD: bouwflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bouwflow -d bouwflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - bouwflow-postgres:/var/lib/postgresql/data

volumes:
  bouwflow-postgres:
