name: Validate release candidate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Lint application
        run: npm run lint

      - name: Test API and database workflows
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Validate public trust files
        run: |
          test -f dist/.well-known/security.txt
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          grep -q 'Canonical: https://aifestival.be/.well-known/security.txt' dist/.well-known/security.txt
          grep -q 'https://aifestival.be/sitemap.xml' dist/robots.txt

      - name: Validate production service compatibility
        run: |
          ! grep -q -- '--jitless' ops/bouwflow-api.service
          ! grep -q '^MemoryDenyWriteExecute=true$' ops/bouwflow-api.service
          grep -q 'chmod 0711 "$release"' ops/deploy-bouwflow
          grep -q 'find "$release/public" -type d' ops/deploy-bouwflow
